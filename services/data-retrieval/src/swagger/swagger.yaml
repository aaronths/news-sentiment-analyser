openapi: 3.0.0
info:
  title: News Sentiment Analyzer - Retrieval API
  description: API for retrieving indexed news and running sentiment analytics.
  version: 1.3.0

servers:
  - url: http://localhost:8001
    description: Local development server
  - url: https://mbqiv0owad.execute-api.us-east-1.amazonaws.com/dev
    description: AWS API Gateway (Dev environment)
  - url: https://7l6czvdc4f.execute-api.us-east-1.amazonaws.com/prod
    description: PRODUCTION AWS API Gateway (PRODUCTION environment)

security:
  - ApiKeyAuth: []

paths:
  /api/articles:
    get:
      summary: Retrieve articles by keyword
      description: Returns ranked sources and top matching articles for a keyword.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
          example: guardian
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          example: 5
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Search result payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/articles/metadata:
    get:
      summary: Retrieve article metadata
      description: Returns article titles, authors, dates, and sources without the full body.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article metadata list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/articles/{id}:
    get:
      summary: Retrieve a single article by ID
      description: Returns the full article including body content.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: article_123
      responses:
        "200":
          description: A single article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleNotFoundError"

  /api/articles/{id}/sentiment:
    get:
      summary: Get sentiment for a single article
      description: Returns sentiment analysis scoped to a specific article by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: article_123
      responses:
        "200":
          description: Sentiment result for the article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleSentimentResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleNotFoundError"

  /api/sentiment:
    get:
      summary: Get sentiment analysis for a keyword
      description: Runs sentiment analysis on articles matching a keyword.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: economy
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
          example: guardian
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
          example: 7d
      responses:
        "200":
          description: Sentiment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sentiment/source:
    get:
      summary: Get source-specific sentiment for a keyword
      description: Returns sentiment metrics for one keyword within one source.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceId
          in: query
          required: true
          schema:
            type: string
          example: guardian
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
          example: 7d
      responses:
        "200":
          description: Source sentiment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sentiment/compare:
    get:
      summary: Compare source sentiment for a keyword
      description: Returns sentiment comparison across source outlets for one keyword.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceIds
          in: query
          required: false
          schema:
            type: string
          example: guardian,nyt
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
          example: 7d
      responses:
        "200":
          description: Source sentiment comparison response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentComparisonResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sentiment/trend:
    get:
      summary: Get sentiment trend for a keyword over time
      description: Returns how sentiment for a specific keyword has changed over a given timeframe, bucketed by day.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
          example: guardian
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
          example: 7d
      responses:
        "200":
          description: Time-series sentiment trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentTrend"
        "400":
          description: Invalid or missing keyword/timeframe parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeframeError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/trend:
    get:
      summary: Get article volume trend for a keyword over time
      description: >
        Returns a time-series showing how many articles mentioning a keyword were
        published within the given timeframe. Bucketed by day for 7d/30d, and by
        hour for 24h. Zero-filled gaps are included so the series is continuous
        and ready to plot directly.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
          example: 7d
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
          example: guardian
      responses:
        "200":
          description: Article volume time series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleVolumeTrend"
        "400":
          description: Invalid or missing keyword/timeframe parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeframeError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/trending:
    get:
      summary: Retrieve trending keywords
      description: Returns keywords currently trending based on article frequency.
      parameters:
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 24h
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Trending keywords
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingResponse"
        "400":
          description: Invalid or missing timeframe parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeframeError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sources:
    get:
      summary: List available news sources
      description: Returns all news sources currently indexed in the system.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          example: 20
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 30d
      responses:
        "200":
          description: List of news sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/chart/sentiment/trend:
    get:
      summary: Chart.js payload for sentiment trend
      description: Returns Chart.js-compatible line chart data for sentiment trend.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
          example: guardian
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
      responses:
        "200":
          description: Chart.js line chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/chart/sources/compare:
    get:
      summary: Chart.js payload for source comparison
      description: Returns Chart.js-compatible bar chart data across sources.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceIds
          in: query
          required: false
          schema:
            type: string
          example: guardian,nyt
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
      responses:
        "200":
          description: Chart.js bar chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/key:
    get:
      summary: Retrieve current API key details
      description: >
        Returns metadata about the authenticated user's active API key.
        The raw key value is never returned after initial creation.
      responses:
        "200":
          description: API key metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No active API key found for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

    post:
      summary: Create a new API key
      description: >
        Generates a new API key. The full key value is returned only once in
        this response and cannot be retrieved again — store it securely.
        This is the only route that does not require an existing API key.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreateRequest"
      responses:
        "201":
          description: API key created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
        "409":
          description: An active API key already exists for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

    delete:
      summary: Revoke the current API key
      description: >
        Permanently revokes the authenticated user's active API key.
        Any subsequent requests using this key will be rejected immediately.
      responses:
        "200":
          description: API key revoked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRevokeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No active API key found for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /api/chart/mentions/monthly:
    get:
      summary: Chart.js payload for monthly keyword mentions by source
      description: Returns a comparative bar chart showing how many article titles mention the keyword each month in a selected year, grouped by source.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: Trump
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            default: 2026
          example: 2025
        - name: sourceLimit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
          example: 5
      responses:
        "200":
          description: Chart.js grouped bar chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"
        "400":
          description: Invalid or missing keyword/year parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordError"

  /api/chart/mentions/monthly.png:
    get:
      summary: Rendered PNG chart for monthly keyword mentions by source
      description: Returns a rendered grouped bar chart image showing monthly title mentions by source for a keyword and year.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: Trump
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            default: 2026
          example: 2025
        - name: sourceLimit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
          example: 5
        - name: width
          in: query
          required: false
          schema:
            type: integer
            default: 1400
          example: 1600
        - name: height
          in: query
          required: false
          schema:
            type: integer
            default: 800
          example: 900
      responses:
        "200":
          description: PNG image response
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid or missing keyword/year parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"

  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
          example: article_123
        title:
          type: string
          example: Inflation rises again
        author:
          type: string
          example: John Smith
        source:
          type: string
          example: The Guardian
        publishedAt:
          type: string
          format: date-time
        body:
          type: string
        url:
          type: string

    ArticleMetadata:
      type: object
      properties:
        id:
          type: string
          example: article_123
        title:
          type: string
          example: Inflation rises again
        author:
          type: string
          example: John Smith
        source:
          type: string
          example: The Guardian
        publishedAt:
          type: string
          format: date-time

    SentimentResult:
      type: object
      properties:
        keyword:
          type: string
        sourceId:
          type: string
          nullable: true
        sourceName:
          type: string
          nullable: true
        timeframe:
          type: string
          enum: [24h, 7d, 30d]
        articleCount:
          type: integer
        averageSentiment:
          type: number
          description: Average VADER compound score
          example: 0.35
        distribution:
          type: object
          properties:
            positive:
              type: integer
            neutral:
              type: integer
            negative:
              type: integer

    SentimentComparisonItem:
      type: object
      properties:
        keyword:
          type: string
        sourceId:
          type: string
        sourceName:
          type: string
        timeframe:
          type: string
          enum: [24h, 7d, 30d]
        articleCount:
          type: integer
        averageSentiment:
          type: number
        distribution:
          type: object
          properties:
            positive:
              type: integer
            neutral:
              type: integer
            negative:
              type: integer

    SentimentComparisonResponse:
      type: object
      properties:
        keyword:
          type: string
        timeframe:
          type: string
          enum: [24h, 7d, 30d]
        sourcesCompared:
          type: integer
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/SentimentComparisonItem"

    ArticleSentimentResult:
      type: object
      properties:
        articleId:
          type: string
          example: article_123
        title:
          type: string
          example: Inflation rises again
        sentimentScore:
          type: number
          description: VADER compound score between -1 (most negative) and 1 (most positive)
          example: 0.42
        sentimentLabel:
          type: string
          enum: [positive, neutral, negative]
          example: positive
        publishedAt:
          type: string
          format: date-time

    SentimentTrend:
      type: object
      properties:
        keyword:
          type: string
          example: inflation
        sourceId:
          type: string
          nullable: true
        timeframe:
          type: string
          enum: [24h, 7d, 30d]
          example: 7d
        dataPoints:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: "2025-03-01"
              averageSentiment:
                type: number
                description: Average VADER compound score for that day
                example: -0.12
              articleCount:
                type: integer
                example: 14

    ArticleVolumeTrend:
      type: object
      properties:
        keyword:
          type: string
          example: inflation
        sourceId:
          type: string
          nullable: true
          example: guardian
        timeframe:
          type: string
          enum: [24h, 7d, 30d]
          example: 7d
        totalArticles:
          type: integer
          description: Total number of matching articles across the entire timeframe
          example: 94
        dataPoints:
          type: array
          description: >
            One entry per day (7d/30d) or per hour (24h), ordered chronologically.
            Zero-count buckets are included for a continuous, plot-ready series.
          items:
            type: object
            properties:
              date:
                type: string
                description: >
                  ISO 8601 date for 7d/30d buckets (YYYY-MM-DD), or ISO 8601
                  datetime truncated to the hour for 24h buckets (YYYY-MM-DDTHH:00:00Z).
                example: "2025-03-01"
              articleCount:
                type: integer
                description: Number of matching articles published in this bucket
                example: 12

    Source:
      type: object
      properties:
        id:
          type: string
          example: source_001
        name:
          type: string
          example: The Guardian
        url:
          type: string
          example: https://theguardian.com
        articleCount:
          type: integer
          description: Total number of articles indexed from this source
          example: 1042
        latestPublishedAt:
          type: string
          format: date-time

    TrendingKeyword:
      type: object
      properties:
        keyword:
          type: string
        count:
          type: integer

    TrendingResponse:
      type: object
      properties:
        timeframe:
          type: string
          enum: [24h, 7d, 30d]
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/TrendingKeyword"

    ChartDataset:
      type: object
      properties:
        label:
          type: string
        data:
          type: array
          items:
            type: number
        borderColor:
          type: string
        backgroundColor:
          type: string
        yAxisID:
          type: string

    ChartPayload:
      type: object
      properties:
        chartType:
          type: string
          enum: [line, bar]
        labels:
          type: array
          items:
            type: string
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataset"
        meta:
          type: object

    ArticlesResponse:
      type: object
      properties:
        keyword:
          type: string
        totalMatches:
          type: integer
        rankings:
          type: array
          items:
            type: object
        articles:
          type: array
          items:
            type: object
        self:
          type: string

    ApiKeyMetadata:
      type: object
      properties:
        keyId:
          type: string
          description: Unique identifier for the API key
          example: key_abc123
        label:
          type: string
          description: Human-readable label assigned at creation
          example: My production key
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent authenticated request, or null if never used
        status:
          type: string
          enum: [active, revoked]
          example: active

    ApiKeyCreateRequest:
      type: object
      properties:
        label:
          type: string
          description: Optional human-readable label to identify this key
          example: My production key

    ApiKeyCreateResponse:
      type: object
      properties:
        keyId:
          type: string
          example: key_abc123
        key:
          type: string
          description: The full API key value — shown only once, store it securely
          example: nsa_live_x7k2...
        label:
          type: string
          example: My production key
        createdAt:
          type: string
          format: date-time

    ApiKeyRevokeResponse:
      type: object
      properties:
        keyId:
          type: string
          example: key_abc123
        revokedAt:
          type: string
          format: date-time
        message:
          type: string
          example: API key revoked successfully

    AuthError:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: "Missing or invalid API key"

    ArticleNotFoundError:
      type: object
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: "Article could not be found (invalid article id)"

    KeywordError:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid keyword parameter"

    TimeframeError:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid timeframe parameter"
