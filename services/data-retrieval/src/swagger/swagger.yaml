openapi: 3.0.0
info:
  title: News Sentiment Analyzer - Retrieval API
  description: API for retrieving indexed news and running sentiment analytics.
  version: 1.2.0

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://mbqiv0owad.execute-api.us-east-1.amazonaws.com/dev
    description: AWS API Gateway (Dev environment)

paths:
  /api/articles:
    get:
      summary: Retrieve articles by keyword
      description: Returns ranked sources and top matching articles for a keyword.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
          example: guardian
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          example: 5
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Search result payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlesResponse"

  /api/articles/metadata:
    get:
      summary: Retrieve article metadata
      description: Returns article titles, authors, dates, and sources without the full body
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article metadata list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleMetadata"

  /api/articles/{id}:
    get:
      summary: Retrieve a single article by ID
      description: Returns the full article including body content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: article_123
      responses:
        "200":
          description: A single article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleNotFoundError"

  /api/articles/{id}/sentiment:
    get:
      summary: Get sentiment for a single article
      description: Returns sentiment analysis scoped to a specific article by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: article_123
      responses:
        "200":
          description: Sentiment result for the article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleSentimentResult"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleNotFoundError"

  /api/sentiment:
    get:
      summary: Get sentiment analysis for a keyword
      description: Runs sentiment analysis on articles matching a keyword
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: economy
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
          example: guardian
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
          example: 7d
      responses:
        "200":
          description: Sentiment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentResult"

  /api/sentiment/source:
    get:
      summary: Get source-specific sentiment for a keyword
      description: Returns sentiment metrics for one keyword within one source.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceId
          in: query
          required: true
          schema:
            type: string
          example: guardian
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
          example: 7d
      responses:
        "200":
          description: Source sentiment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentResult"

  /api/sentiment/compare:
    get:
      summary: Compare source sentiment for a keyword
      description: Returns sentiment comparison across source outlets for one keyword.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceIds
          in: query
          required: false
          schema:
            type: string
          example: guardian,nyt
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
          example: 7d
      responses:
        "200":
          description: Source sentiment comparison response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentComparisonResponse"

  /api/sentiment/trend:
    get:
      summary: Get sentiment trend for a keyword over time
      description: Returns how sentiment for a specific keyword has changed over a given timeframe, bucketed by day
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
          example: guardian
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
          example: 7d
      responses:
        "200":
          description: Time-series sentiment trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentTrend"
        "400":
          description: Invalid or missing keyword/timeframe parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeframeError"

  /api/trending:
    get:
      summary: Retrieve trending keywords
      description: Returns keywords currently trending based on article frequency.
      parameters:
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 24h
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Trending keywords
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingResponse"
        "400":
          description: Invalid or missing timeframe parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeframeError"

  /api/sources:
    get:
      summary: List available news sources
      description: Returns all news sources currently indexed in the system
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          example: 20
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 30d
      responses:
        "200":
          description: List of news sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"

  /api/chart/sentiment/trend:
    get:
      summary: Chart.js payload for sentiment trend
      description: Returns Chart.js-compatible line chart data for sentiment trend.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
          example: guardian
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
      responses:
        "200":
          description: Chart.js line chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"

  /api/chart/sources/compare:
    get:
      summary: Chart.js payload for source comparison
      description: Returns Chart.js-compatible bar chart data across sources.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          example: inflation
        - name: sourceIds
          in: query
          required: false
          schema:
            type: string
          example: guardian,nyt
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 7d
      responses:
        "200":
          description: Chart.js bar chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"

components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
          example: article_123
        title:
          type: string
          example: Inflation rises again
        author:
          type: string
          example: John Smith
        source:
          type: string
          example: The Guardian
        publishedAt:
          type: string
          format: date-time
        body:
          type: string
        url:
          type: string

    ArticleMetadata:
      type: object
      properties:
        id:
          type: string
          example: article_123
        title:
          type: string
          example: Inflation rises again
        author:
          type: string
          example: John Smith
        source:
          type: string
          example: The Guardian
        publishedAt:
          type: string
          format: date-time

    SentimentResult:
      type: object
      properties:
        keyword:
          type: string
        sourceId:
          type: string
          nullable: true
        sourceName:
          type: string
          nullable: true
        timeframe:
          type: string
          enum: [24h, 7d, 30d]
        articleCount:
          type: integer
        averageSentiment:
          type: number
          description: Average VADER compound score
          example: 0.35
        distribution:
          type: object
          properties:
            positive:
              type: integer
            neutral:
              type: integer
            negative:
              type: integer

    SentimentComparisonItem:
      type: object
      properties:
        keyword:
          type: string
        sourceId:
          type: string
        sourceName:
          type: string
        timeframe:
          type: string
          enum: [24h, 7d, 30d]
        articleCount:
          type: integer
        averageSentiment:
          type: number
        distribution:
          type: object
          properties:
            positive:
              type: integer
            neutral:
              type: integer
            negative:
              type: integer

    SentimentComparisonResponse:
      type: object
      properties:
        keyword:
          type: string
        timeframe:
          type: string
          enum: [24h, 7d, 30d]
        sourcesCompared:
          type: integer
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/SentimentComparisonItem"

    ArticleSentimentResult:
      type: object
      properties:
        articleId:
          type: string
          example: article_123
        title:
          type: string
          example: Inflation rises again
        sentimentScore:
          type: number
          description: VADER compound score between -1 (most negative) and 1 (most positive)
          example: 0.42
        sentimentLabel:
          type: string
          enum: [positive, neutral, negative]
          example: positive
        publishedAt:
          type: string
          format: date-time

    SentimentTrend:
      type: object
      properties:
        keyword:
          type: string
          example: inflation
        sourceId:
          type: string
          nullable: true
        timeframe:
          type: string
          enum: [24h, 7d, 30d]
          example: 7d
        dataPoints:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: "2025-03-01"
              averageSentiment:
                type: number
                description: Average VADER compound score for that day
                example: -0.12
              articleCount:
                type: integer
                example: 14

    Source:
      type: object
      properties:
        id:
          type: string
          example: source_001
        name:
          type: string
          example: The Guardian
        url:
          type: string
          example: https://theguardian.com
        articleCount:
          type: integer
          description: Total number of articles indexed from this source
          example: 1042
        latestPublishedAt:
          type: string
          format: date-time

    TrendingKeyword:
      type: object
      properties:
        keyword:
          type: string
        count:
          type: integer

    TrendingResponse:
      type: object
      properties:
        timeframe:
          type: string
          enum: [24h, 7d, 30d]
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/TrendingKeyword"

    ChartDataset:
      type: object
      properties:
        label:
          type: string
        data:
          type: array
          items:
            type: number
        borderColor:
          type: string
        backgroundColor:
          type: string
        yAxisID:
          type: string

    ChartPayload:
      type: object
      properties:
        chartType:
          type: string
          enum: [line, bar]
        labels:
          type: array
          items:
            type: string
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataset"
        meta:
          type: object

    ArticlesResponse:
      type: object
      properties:
        keyword:
          type: string
        totalMatches:
          type: integer
        rankings:
          type: array
          items:
            type: object
        articles:
          type: array
          items:
            type: object
        self:
          type: string

    ArticleNotFoundError:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Article could not be found (invalid article id)"

    KeywordError:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid keyword parameter"

    TimeframeError:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid timeframe parameter"